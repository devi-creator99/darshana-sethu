<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚖 Darshana Sethu Cab Service</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<img src="logo.png" class="logo" alt="Logo">

<h1>🚖 DARSHANA SETHU CAB SERVICE</h1>

<p class="tagline">
<b>మీ ప్రయాణం... మా బాధ్యత</b><br>
Your Journey... Our Responsibility
</p>

<label>👤 Customer Name</label>
<input type="text" id="name" placeholder="Enter Customer Name">

<label>📞 Phone Number</label>
<input type="tel" id="phone" placeholder="Enter Phone Number">

<label>📍 Pickup Location</label>
<input type="text" id="pickup" placeholder="Enter Pickup Location">

<label>📍 Drop Location</label>
<input type="text" id="drop" placeholder="Enter Drop Location">

<label>🚘 Trip Type</label>
<select id="trip">
<option value="">Select Trip Type</option>
<option>One Way</option>
<option>Round Trip</option>
</select>

<label>📅 Journey Date</label>
<input type="date" id="date">

<label>🕒 Pickup Time</label>
<input type="time" id="time">

<label>👥 Passengers</label>
<input type="number" id="passengers" placeholder="Passengers">

<button onclick="submitBooking()">
🚖 BOOK NOW
</button>

<div id="successBox"></div>

</div>

<script src="script.js"></script>

</body>
</html>
