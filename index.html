<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚖 Darshana Sethu Cab Service</title>

<link rel="icon" type="image/png" href="logo.png">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="container">

<h1>🚖 Darshana Sethu Cab Service</h1>

<p class="tagline">
<b>మీ ప్రయాణం... మా బాధ్యత</b><br>
Your Journey... Our Responsibility
</p>

<label>👤 Customer Name / కస్టమర్ పేరు</label>
<input type="text" id="name" placeholder="Enter Customer Name">

<label>📞 Phone Number / ఫోన్ నంబర్</label>
<input type="tel" id="phone" placeholder="Enter Phone Number">

<label>📍 Pickup Location / పికప్ స్థలం</label>
<input type="text" id="pickup" placeholder="Enter Pickup Location">

<label>📍 Drop Location / డ్రాప్ స్థలం</label>
<input type="text" id="drop" placeholder="Enter Drop Location">

<label>🚘 Trip Type / ప్రయాణ రకం</label>
<select id="trip">
<option value="">Select Trip Type</option>
<option value="One Way">🚖 One Way</option>
<option value="Round Trip">🔄 Round Trip</option>
</select>

<label>📅 Journey Date / ప్రయాణ తేదీ</label>
<input type="date" id="date">

<label>🕒 Pickup Time / పికప్ సమయం</label>
<input type="time" id="time">

<label>👥 Number of Passengers / ప్రయాణికుల సంఖ్య</label>
<input type="number" id="passengers" placeholder="Enter Passengers">

<button type="button" onclick="submitBooking()">
🚖 Submit Booking / బుకింగ్ పంపండి
</button>

<div id="successBox" style="display:none;">
<h3>🎉 Booking Successfully Received</h3>
<p id="bookingResult"></p>

<p>
🙏 Thank you for choosing<br>
<b>Darshana Sethu Cab Service</b><br><br>
మా టీమ్ త్వరలో మిమ్మల్ని సంప్రదిస్తుంది.
</p>
</div>

</div>

<script src="script.js"></script>

</body>
</html>
