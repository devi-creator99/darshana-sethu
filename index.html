<!DOCTYPE html>
<html lang="te">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Darshana Sethu Cab Service</title>

<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<img src="logo.png" class="logo" alt="Darshana Sethu Logo">

<h1>🚖 DARSHANA SETHU CAB SERVICE</h1>

<p class="tagline">
<strong>మీ ప్రయాణం... మా బాధ్యత</strong><br>
Your Journey... Our Responsibility
</p>

<div class="booking-box">

<h2>🚖 BOOK YOUR CAB</h2>

<label>👤 Customer Name</label>
<input type="text" id="name" placeholder="ENTER CUSTOMER NAME">

<label>📞 Mobile Number</label>
<input type="tel" id="phone" maxlength="10" placeholder="ENTER MOBILE NUMBER">

<label>📍 Pickup Location</label>
<input type="text" id="pickup" placeholder="ENTER PICKUP LOCATION">

<label>📍 Drop Location</label>
<input type="text" id="drop" placeholder="ENTER DROP LOCATION">
