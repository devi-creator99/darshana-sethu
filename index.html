<!DOCTYPE html>
<html lang="te">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>🚖 Darshana Sethu Cab</title>

<link rel="icon" href="logo.png" type="image/png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Telugu:wght@400;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<img src="logo.png" class="logo">

<h1>🚖 DARSHANA SETHU CAB</h1>

<p class="tagline">
<b>మీ ప్రయాణం... మా బాధ్యత</b><br>
Your Journey... Our Responsibility
</p>

<label><b>👤 CUSTOMER NAME / కస్టమర్ పేరు</b></label>
<input
type="text"
id="name"
style="text-transform:uppercase;font-weight:bold;font-size:18px;"
placeholder="ENTER CUSTOMER NAME">

<label><b>📞 PHONE NUMBER</b></label>
<input type="tel" id="phone">

<label><b>📍 PICKUP LOCATION</b></label>
<input type="text" id="pickup">

<label><b>📍 DROP LOCATION</b></label>
<input type="text" id="drop">

<label><b>🚖 TRIP TYPE</b></label>

<select id="trip">
<option>One Way</option>
<option>Round Trip</option>
</select>

<label><b>📅 JOURNEY DATE</b></label>
<input type="date" id="date">

<label><b>🕒 PICKUP TIME</b></label>
<input type="time" id="time">

<label><b>👥 PASSENGERS</b></label>
<input type="number" id="passengers">

<button onclick="submitBooking()">
🚖 BOOK NOW
</button>

<div id="successBox">

<h2>🎉 BOOKING CONFIRMED</h2>

<div class="booking-id">

🆔 BOOKING ID

<h1 id="bookingId">DSC-2026-000001</h1>

</div>

<p id="bookingResult"></p>

<h3>

🙏 THANK YOU

<br>

DARSHANA SETHU CAB

</h3>

<p>

మీ బుకింగ్ విజయవంతంగా నమోదు అయింది.

మా టీమ్ త్వరలో మిమ్మల్ని సంప్రదిస్తుంది.

</p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
